<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Orders Dashboard</h1>
    <div class="header-buttons">
      <button class="update-btn" routerLink="/update-menu">Update Menu</button>
      <button class="logout-btn">Logout</button>
    </div>
  </header>

  <section class="orders-section">
    <div class="orders-header">
      <h2>Orders</h2>
      <input #searchBox type="text" placeholder="Search Orders" (input)="onSearch(searchBox.value)" class="search-bar" />
      <button class="refresh-btn" (click)="refreshOrders()">Refresh Orders</button>
    </div>
    <table class="orders-table">
      <thead>
        <tr>
          <th>Order Id</th>
          <th>Items</th>
          <th>Status</th>
          <th>Total</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>{{ order.orderId }}</td>
          <td>
            <ul>
              <li *ngFor="let item of order.items">
                {{ item.name }} - {{ item.qty }}
              </li>
            </ul>
          </td>
          <td>
            <span class="status-chip" [ngClass]="order.status.toLowerCase().replace(' ','-')">
              {{ order.status }}
            </span>
          </td>
          <td>Rs {{ order.totalCost }}</td>
          <td>
            <div class="action-buttons">
              <button class="tick-btn" (click)="onServe(order)" title="Mark as Served">✓</button>
              <button class="cancel-btn" (click)="onCancel(order)" title="Mark as Cancelled">✕</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
  
  <!-- Confirmation Modal -->
  <div class="confirmation-modal" *ngIf="showConfirmationModal">
    <div class="modal-content">
      <h3>Confirm Status Change</h3>
      <p *ngIf="pendingStatus === 'Served'">
        Mark order <strong>{{ pendingOrder?.orderId }}</strong> as <strong style="color: #166534;">Served</strong>?
      </p>
      <p *ngIf="pendingStatus === 'Cancelled'">
        Mark order <strong>{{ pendingOrder?.orderId }}</strong> as <strong style="color: #991b1b;">Cancelled</strong>?
      </p>
      <div class="modal-buttons">
        <button class="btn-cancel" (click)="closeConfirmationModal()">No</button>
        <button class="btn-confirm" (click)="confirmStatusUpdate()">Yes</button>
      </div>
    </div>
  </div>
</div>
