<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Orders Dashboard</h1>
    <div class="header-buttons">
      <button class="update-btn" routerLink="/update-menu">Update Menu</button>
      <button class="logout-btn">Logout</button>
    </div>
  </header>

  <section class="orders-section">
    <div class="orders-header">
      <h2>Orders</h2>
      <button class="refresh-btn" (click)="refreshOrders()">Refresh Orders</button>
    </div>
    <table class="orders-table">
      <thead>
        <tr>
          <th>Order Id</th>
          <th>Items</th>
          <th>Status</th>
          <th>Total</th>
          <th>Change Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>{{ order.orderId }}</td>
          <td>
            <ul>
              <li *ngFor="let item of order.items">
                {{ item.name }} - {{ item.qty }}
              </li>
            </ul>
          </td>
          <td>
            <span class="status-chip" [ngClass]="order.status.toLowerCase().replace(' ','-')">
              {{ order.status }}
            </span>
          </td>
          <td>Rs {{ order.totalCost }}</td>
          <td>
            <select #statusSelect (change)="onStatusChange(order, statusSelect.value)">
              <option value="" disabled selected>Select Status</option>
              <option value="Received">Received</option>
              <option value="Preparing">Preparing</option>
              <option value="Ready">Ready</option>
              <option value="Served">Served</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
  
  <!-- Confirmation Modal -->
  <div class="confirmation-modal" *ngIf="showConfirmationModal">
    <div class="modal-content">
      <h3>Confirm Status Change</h3>
      <p>Are you sure you want to change the status to <strong>{{ pendingStatus }}</strong>?</p>
      <div class="modal-buttons">
        <button class="btn-cancel" (click)="closeConfirmationModal()">No</button>
        <button class="btn-confirm" (click)="confirmStatusUpdate()">Yes</button>
      </div>
    </div>
  </div>
</div>
